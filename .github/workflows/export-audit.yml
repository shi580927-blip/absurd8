name: Export audit snapshot
on:
  push:
    branches: [audit-current-20260915]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: zip -qr source-snapshot.zip . -x '.git/*' 'source-snapshot.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: audit-source-snapshot
          path: source-snapshot.zip
          retention-days: 1

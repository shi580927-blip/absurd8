name: Install Chef antics atlas

on:
  push:
    paths:
      - "tmp/chef-atlas-ready"

permissions:
  contents: write

jobs:
  install-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode optimized atlas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/antics
          cat tmp/chef-atlas-part-*.b64 | base64 --decode > assets/images/antics/chef-antics-atlas.webp
          test -s assets/images/antics/chef-antics-atlas.webp
      - name: Commit atlas and remove temporary installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/antics/chef-antics-atlas.webp
          git rm -f tmp/chef-atlas-part-*.b64 tmp/chef-atlas-ready .github/workflows/install-chef-atlas.yml
          git commit -m "Add optimized Chef antics atlas"
          git push

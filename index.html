<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffb84d">
  <title>Кот, который слишком хорошо живёт</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="topbar">
      <div><span class="eyebrow">СОСТОЯНИЕ ШЕФА</span><h1 id="food">0 рыбок</h1></div>
      <button id="sound" class="round" aria-label="Звук">🔊</button>
    </header>

    <section class="scene">
      <div id="phrase" class="speech">В этой миске подозрительно видно дно.</div>
      <button id="cat" class="cat" aria-label="Покормить кота">
        <img id="catBody" src="assets/images/shef-level-2.png" alt="Рыжий кот Шеф">
      </button>
      <img class="bowl" src="assets/images/bowl-empty.png" alt="Пустая миска">
      <button id="feed" class="feed">🐟 ПОКОРМИТЬ <small id="perClick">+1 рыбка</small></button>
      <p class="hint">Можно нажимать на кота или на кнопку</p>
    </section>

    <section class="status">
      <div><span>Уровень наглости</span><strong id="level">1 · Голодный стратег</strong></div>
      <div class="meter"><i id="levelProgress"></i></div>
      <div class="income">Доход: <b id="income">0</b> рыбок/сек.</div>
    </section>

    <nav class="bottom-nav">
      <button class="nav-button active">🐟<span>Кормить</span></button>
      <button id="openShop" class="nav-button">⬆️<span>Улучшения</span></button>
      <button class="nav-button">👕<span>Шкаф</span></button>
      <button class="nav-button">🏆<span>Награды</span></button>
    </nav>

    <section id="shop" class="shop" aria-hidden="true">
      <div class="shop-head"><h2>Улучшить жизнь Шефа</h2><button id="closeShop" class="close" aria-label="Закрыть">×</button></div>
      <button id="bonus" class="bonus">🎁 Получить 50 рыбок <small>Бесплатный бонус раз в минуту</small></button>
      <div id="upgrades" class="upgrade-list"></div>
    </section>
  </main>
  <div id="floaters" aria-hidden="true"></div>
  <script src="game.js"></script>
</body>
</html>
